[project]
name = "ato"
version = "0.1.0"
description = "Institutional autonomous AI organization scaffold."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ato"]
