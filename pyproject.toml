[project]
name = "ato"
version = "0.1.0"
description = "Institutional autonomous AI organization scaffold."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ato"]
